name: Refresh Feed

on:
  schedule:
    # 北京时间 08:17 = UTC 00:17，避开整点与半点高峰
    - cron: "17 0 * * *"
    # 北京时间 21:23 = UTC 13:23，避开整点高峰
    - cron: "23 13 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}
      ARTICLES_BEFORE_PATH: /tmp/carfeed-articles-before.json
      TRANSLATION_TARGETS_PATH: /tmp/carfeed-translation-targets.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate DeepSeek credentials
        id: validate_key
        continue-on-error: true
        run: node scripts/validate-deepseek-config.js

      - name: Snapshot previous feed
        if: steps.validate_key.outcome == 'success'
        run: |
          if [ -f ./02-inputs/data/articles.json ]; then
            cp ./02-inputs/data/articles.json "$ARTICLES_BEFORE_PATH"
          else
            printf '[]\n' > "$ARTICLES_BEFORE_PATH"
          fi

      - name: Fetch latest articles
        id: fetch_step
        if: steps.validate_key.outcome == 'success'
        continue-on-error: true
        run: node scripts/fetch.js

      - name: Prepare translation queue
        if: always()
        run: |
          node scripts/prepare-translation-targets.js \
            --before "$ARTICLES_BEFORE_PATH" \
            --after ./02-inputs/data/articles.json \
            --translations ./02-inputs/data/translations-deepseek.json \
            --targets-out "$TRANSLATION_TARGETS_PATH" \
            --status-out ./02-inputs/data/automation-status.json \
            --limit 400 \
            --new-only

      - name: Translate all newly fetched articles
        id: translate_step
        if: steps.validate_key.outcome == 'success' && steps.fetch_step.outcome == 'success'
        continue-on-error: true
        run: |
          npm run translate:deepseek -- \
            --limit 400 \
            --targets-file "$TRANSLATION_TARGETS_PATH" \
            --status-file ./02-inputs/data/automation-status.json

      - name: Build static site
        id: build_step
        if: steps.validate_key.outcome == 'success' && steps.fetch_step.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Finalize automation status
        if: always()
        run: |
          node scripts/finalize-automation-status.js \
            --status ./02-inputs/data/automation-status.json \
            --articles ./02-inputs/data/articles.json \
            --translations ./02-inputs/data/translations-deepseek.json \
            --fetch-outcome "${{ steps.fetch_step.outcome }}" \
            --translate-outcome "${{ steps.translate_step.outcome }}" \
            --build-outcome "${{ steps.build_step.outcome }}" \
            --event "${{ github.event_name }}" \
            --run-id "${{ github.run_id }}" \
            --sha "${{ github.sha }}"

      - name: Commit updated feed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 02-inputs/data/articles.json 02-inputs/data/archive.json 02-inputs/data/translations-deepseek.json 02-inputs/data/automation-status.json
          git add -f dist
          git diff --cached --quiet || git commit -m "chore: refresh feed data"

      - name: Push changes
        if: always()
        run: git push

      - name: Fail workflow when refresh pipeline fails
        if: always()
        run: |
          if [ "${{ steps.validate_key.outcome }}" != "success" ]; then
            echo "DeepSeek credential validation failed"
            exit 1
          fi
          if [ "${{ steps.fetch_step.outcome }}" != "success" ]; then
            echo "Fetch step failed"
            exit 1
          fi
          if [ "${{ steps.translate_step.outcome }}" != "success" ]; then
            echo "Translate step failed"
            exit 1
          fi
          if [ "${{ steps.build_step.outcome }}" != "success" ]; then
            echo "Build step failed"
            exit 1
          fi
