name: Refresh Feed

on:
  schedule:
    # Temporary verification windows for 2026-04-01 morning (Asia/Shanghai):
    # 09:10 CST = 01:10 UTC
    # 09:25 CST = 01:25 UTC
    - cron: "10 1 * * *"
    - cron: "25 1 * * *"
    - cron: "13 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest articles
        run: node scripts/fetch.js

      - name: Build static site
        run: npm run build

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/archive.json dist
          git diff --cached --quiet || git commit -m "chore: refresh feed data"

      - name: Push changes
        run: git push
