<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarFeed</title>
  <meta name="description" content="CarFeed 聚合全球汽车、摩托与改装资讯，每天持续更新。" />
  <meta property="og:title" content="CarFeed" />
  <meta property="og:description" content="聚合全球汽车、摩托与改装资讯的信息流页面。" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CarFeed" />
  <style>
    :root {
      --page-bg: #f5f1e8;
      --card-bg: #ffffff;
      --text-main: #222222;
      --text-muted: #6a655f;
      --accent: #123263;
      --accent-soft: rgba(18, 50, 99, 0.12);
      --accent-line: rgba(18, 50, 99, 0.74);
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text-main);
      font-family: Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: min(100%, 1440px);
      margin: 0 auto;
      padding: 20px 16px 32px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .chip,
    .search-toggle {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      border-radius: 0;
      padding: 10px 0 12px;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      position: relative;
      outline: none;
      box-shadow: none;
      -webkit-tap-highlight-color: transparent;
    }

    .chip::after,
    .search-toggle::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 6px;
      border-radius: 999px;
      background: transparent;
      transition: background-color 0.18s ease;
    }

    .chip:hover,
    .search-toggle:hover,
    .chip:focus-visible,
    .search-toggle:focus-visible {
      color: var(--text-main);
    }

    .chip.active,
    .search-toggle.active {
      color: var(--text-main);
      font-weight: 700;
    }

    .chip.active::after,
    .search-toggle.active::after {
      background: var(--accent-line);
    }

    .search-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 40px;
      padding: 0;
      flex-shrink: 0;
    }

    .search-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .search-panel {
      display: none;
      max-width: 360px;
      margin: 0 0 18px auto;
    }

    .search-panel.open {
      display: block;
    }

    .search-input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d8d1c3;
      border-radius: 14px;
      font-size: 15px;
      background: #fff;
      outline: none;
    }

    .search-input:focus {
      border-color: rgba(18, 50, 99, 0.45);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .grid {
      column-count: 4;
      column-gap: 18px;
    }

    .card-link {
      color: inherit;
      text-decoration: none;
      display: inline-block;
      width: 100%;
      margin-bottom: 18px;
      break-inside: avoid;
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .card img.cover {
      width: 100%;
      height: auto;
      display: block;
      background: #eee;
    }

    .content {
      padding: 14px 14px 16px;
    }

    .title {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.35;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .source {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .source-mark {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 5px;
      overflow: hidden;
      background: #ece6da;
      color: #52493c;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .source img.logo {
      width: 100%;
      height: 18px;
      display: block;
      object-fit: contain;
    }

    .source-name {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .right-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .date {
      font-size: 12px;
      color: #666;
    }

    .heart {
      font-size: 16px;
      line-height: 1;
      color: #222;
    }

    .empty {
      display: none;
      text-align: center;
      color: #666;
      padding: 24px 12px;
    }

    .empty.show {
      display: block;
    }

    .share-toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(18, 22, 28, 0.92);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 20;
    }

    .share-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1320px) {
      .grid {
        column-count: 3;
      }
    }

    @media (max-width: 980px) {
      .grid {
        column-count: 2;
      }
    }

    @media (max-width: 768px) {
      .page {
        padding: 16px 12px 24px;
      }

      .topbar {
        align-items: center;
      }

      .toolbar {
        gap: 14px;
      }

      .chip,
      .search-toggle {
        font-size: 13px;
        padding: 6px 0 10px;
      }

      .search-toggle {
        width: 22px;
        height: 32px;
      }

      .search-toggle svg {
        width: 16px;
        height: 16px;
      }

      .search-panel {
        max-width: none;
      }

      .grid {
        column-count: 2;
        column-gap: 12px;
      }

      .card-link {
        margin-bottom: 12px;
      }

      .content {
        padding: 8px 8px 10px;
      }

      .title {
        font-size: 12px;
        line-height: 1.25;
        margin-bottom: 8px;
      }

      .source img.logo {
        height: 14px;
      }

      .source-mark {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        font-size: 7px;
      }

      .source-name,
      .date {
        font-size: 10px;
      }

      .heart {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="toolbar" id="filters"></div>
      <button class="search-toggle" id="searchToggle" type="button" aria-label="搜索">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="M16 16l5 5"></path>
        </svg>
      </button>
    </div>
    <div class="search-panel" id="searchPanel">
      <input class="search-input" id="searchInput" type="search" placeholder="搜索标题或来源" />
    </div>
    <div id="articles" class="grid"></div>
    <div class="empty" id="emptyState">没有匹配的内容。</div>
    <div class="share-toast" id="shareToast" role="status" aria-live="polite"></div>
  </main>

  <script>
    const categoryConfig = [
      { key: "all", label: "全部" },
      { key: "car", label: "汽车" },
      { key: "bike", label: "摩托" },
      { key: "custom", label: "改装" }
    ];

    let allArticles = [];
    let activeCategory = "all";
    let searchText = "";
    let shareToastTimer = null;
    let longPressTimer = null;
    let longPressTriggered = false;

    function getSourceInitials(source) {
      return String(source || "")
        .replace(/[^a-z0-9]+/gi, " ")
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map((part) => part[0])
        .join("") || "?";
    }

    function formatDate(dateStr) {
      if (!dateStr) return "";

      if (/^\d{4}\.\d{1,2}\.\d{1,2}$/.test(dateStr)) {
        const parts = dateStr.split(".");
        return `${Number(parts[0])}.${Number(parts[1])}.${Number(parts[2])}`;
      }

      const date = new Date(dateStr);
      if (Number.isNaN(date.getTime())) return dateStr;
      return `${date.getFullYear()}.${date.getMonth() + 1}.${date.getDate()}`;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeImageUrl(url) {
      if (!url) return "";
      return String(url).replace(/-\d+x\d+(?=\.(jpg|jpeg|png|webp|avif)(\?|$))/i, "");
    }

    function withCacheBuster(url, article) {
      if (!url) return "";

      const cacheKey = article.last_seen_at || article.first_seen_at || Date.now();
      try {
        const parsed = new URL(url, window.location.href);
        parsed.searchParams.set("cf_cache_bust", cacheKey);
        return parsed.toString();
      } catch {
        const separator = url.includes("?") ? "&" : "?";
        return `${url}${separator}cf_cache_bust=${encodeURIComponent(cacheKey)}`;
      }
    }

    function getLogoHost(article) {
      if (article.source_logo) {
        try {
          return new URL(article.source_logo, window.location.href).origin;
        } catch {
          return article.source_logo;
        }
      }

      try {
        return new URL(article.url, window.location.href).origin;
      } catch {
        return article.source || "";
      }
    }

    function buildFallbackLogo(host) {
      if (!host) return "";

      try {
        const parsed = new URL(host, window.location.href);
        return `https://www.google.com/s2/favicons?sz=64&domain_url=${encodeURIComponent(parsed.origin)}`;
      } catch {
        return `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(host)}`;
      }
    }

    function getFilteredArticles() {
      const keyword = searchText.trim().toLowerCase();

      return allArticles.filter((article) => {
        const articleCategory = article.category || "car";
        const matchesCategory = activeCategory === "all" || articleCategory === activeCategory;
        if (!matchesCategory) return false;

        if (!keyword) return true;

        const haystack = [
          article.title_en,
          article.source,
          article.category
        ].join(" ").toLowerCase();

        return haystack.includes(keyword);
      });
    }

    function renderLogo(article) {
      const initials = getSourceInitials(article.source);
      const fallbackLogo = buildFallbackLogo(getLogoHost(article));

      if (article.source_logo) {
        return `
          <span class="source-mark" aria-hidden="true">
            <img
              class="logo"
              src="${escapeHtml(article.source_logo)}"
              data-fallback-logo="${escapeHtml(fallbackLogo)}"
              data-initials="${escapeHtml(initials)}"
              alt=""
              loading="lazy"
              onerror="window.handleLogoError(event)"
            >
          </span>
        `;
      }

      return `<span class="source-mark" aria-hidden="true">${escapeHtml(initials)}</span>`;
    }

    function renderFilters() {
      const container = document.getElementById("filters");
      container.innerHTML = categoryConfig.map((item) => `
        <button
          class="chip ${activeCategory === item.key ? "active" : ""}"
          type="button"
          data-category="${item.key}"
        >
          ${item.label}
        </button>
      `).join("");

      container.querySelectorAll("[data-category]").forEach((button) => {
        button.addEventListener("click", () => {
          activeCategory = button.dataset.category;
          renderFilters();
          renderArticles();
        });
      });
    }

    function showToast(message) {
      const toast = document.getElementById("shareToast");
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(shareToastTimer);
      shareToastTimer = window.setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    async function copyToClipboard(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }

      const input = document.createElement("textarea");
      input.value = text;
      input.setAttribute("readonly", "");
      input.style.position = "absolute";
      input.style.left = "-9999px";
      document.body.appendChild(input);
      input.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(input);
      return ok;
    }

    async function shareArticle(article) {
      const shareData = {
        title: article.title_en || "CarFeed",
        text: `${article.source || "CarFeed"} · ${article.title_en || ""}`.trim(),
        url: article.url
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (error) {
          if (error?.name === "AbortError") return;
        }
      }

      try {
        await copyToClipboard(article.url);
        showToast("链接已复制，可直接发送到微信");
      } catch {
        showToast("当前环境不支持系统分享");
      }
    }

    function clearLongPressTimer() {
      if (!longPressTimer) return;
      window.clearTimeout(longPressTimer);
      longPressTimer = null;
    }

    function bindCardShareEvents(articles) {
      const container = document.getElementById("articles");

      container.querySelectorAll(".card-link").forEach((link) => {
        const article = articles[Number(link.dataset.articleIndex)];

        const start = () => {
          longPressTriggered = false;
          clearLongPressTimer();
          longPressTimer = window.setTimeout(async () => {
            longPressTriggered = true;
            await shareArticle(article);
          }, 550);
        };

        const cancel = () => {
          clearLongPressTimer();
        };

        link.addEventListener("pointerdown", start);
        link.addEventListener("pointerup", cancel);
        link.addEventListener("pointerleave", cancel);
        link.addEventListener("pointercancel", cancel);
        link.addEventListener("contextmenu", async (event) => {
          event.preventDefault();
          clearLongPressTimer();
          longPressTriggered = true;
          await shareArticle(article);
        });
        link.addEventListener("click", (event) => {
          if (!longPressTriggered) return;
          event.preventDefault();
          longPressTriggered = false;
        });
      });
    }

    function renderArticles() {
      const articles = getFilteredArticles();
      const container = document.getElementById("articles");
      const emptyState = document.getElementById("emptyState");

      container.innerHTML = articles.map((article, index) => `
        <a
          class="card-link"
          href="${escapeHtml(article.url)}"
          target="_blank"
          rel="noopener noreferrer"
          data-article-index="${index}"
        >
          <div class="card">
            ${article.image ? `<img class="cover" src="${escapeHtml(withCacheBuster(normalizeImageUrl(article.image), article))}" alt="${escapeHtml(article.title_en || "")}" loading="lazy">` : ""}
            <div class="content">
              <div class="title">${escapeHtml(article.title_en || "")}</div>
              <div class="meta-row">
                <div class="source">
                  ${renderLogo(article)}
                  <div class="source-name">${escapeHtml(article.source || "")}</div>
                </div>
                <div class="right-meta">
                  <div class="date">${escapeHtml(formatDate(article.time))}</div>
                  <div class="heart">♡</div>
                </div>
              </div>
            </div>
          </div>
        </a>
      `).join("");

      emptyState.classList.toggle("show", articles.length === 0);
      bindCardShareEvents(articles);
    }

    async function loadArticles() {
      const response = await fetch("./data/articles.json?t=" + Date.now());
      allArticles = await response.json();
      renderFilters();
      renderArticles();
    }

    window.handleLogoError = (event) => {
      const image = event.target;
      const fallbackLogo = image.dataset.fallbackLogo;
      const initials = image.dataset.initials || "?";

      if (fallbackLogo && image.src !== fallbackLogo) {
        image.src = fallbackLogo;
        return;
      }

      image.parentElement.textContent = initials;
    };

    document.getElementById("searchToggle").addEventListener("click", () => {
      const toggle = document.getElementById("searchToggle");
      const panel = document.getElementById("searchPanel");
      panel.classList.toggle("open");
      toggle.classList.toggle("active", panel.classList.contains("open"));
      if (panel.classList.contains("open")) {
        document.getElementById("searchInput").focus();
      }
    });

    document.getElementById("searchInput").addEventListener("input", (event) => {
      searchText = event.target.value;
      renderArticles();
    });

    loadArticles().catch((error) => {
      document.getElementById("emptyState").textContent = `加载失败：${error.message}`;
      document.getElementById("emptyState").classList.add("show");
    });
  </script>
</body>
</html>
